[project]
name = "dispatch"
version = "0.1.0"
description = "Async dispatch worker — orchestrates remote inference (Modal)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "common",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "sentry-sdk>=2.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
