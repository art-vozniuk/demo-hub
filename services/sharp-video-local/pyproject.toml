[project]
name = "sharp-video-local"
version = "0.1.0"
description = "Local Mac pipeline: video → per-frame .splat scenes via Apple ml-sharp on MPS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "Pillow>=11.0.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    # ml-sharp is GitHub-only; mirrors the pin in services/modal/sharp/app.py.
    "sharp @ git+https://github.com/apple/ml-sharp.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
sharp-video = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
