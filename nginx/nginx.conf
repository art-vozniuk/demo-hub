# Supabase serves .html as text/plain — map correct Content-Types for renderer proxy.
# Match on $uri (path without query string) so that /renderer/Sandbox.html?scene=...
# still resolves to text/html instead of falling through to octet-stream.
map $uri $renderer_content_type {
    ~*\.html$   "text/html";
    ~*\.js$     "application/javascript";
    ~*\.wasm$   "application/wasm";
    default     "application/octet-stream";
}

server {
    listen 80;
    server_name artemv.tech www.artemv.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name artemv.tech www.artemv.tech;

    ssl_certificate /etc/letsencrypt/live/artemv.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemv.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana dashboards. Subpath served via GF_SERVER_SERVE_FROM_SUB_PATH
    # (see docker-compose.yml). Auth is Grafana's own login form — admin
    # creds come from GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD env, which
    # the deploy workflow injects from GitHub Secrets.
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — Grafana Live (live updates, alerts) needs it
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Renderer data bundles (~100MB) — served as static files from the VPS.
    # Downloaded from GitHub Releases during deploy to avoid proxy/CORS issues.
    #
    # Cache policy: no-cache (revalidate every load via ETag). The earlier
    # max-age=86400 gave us up-to-24h of "new Sandbox.js running against old
    # cached Sandbox.data": each rebuild reshuffles file offsets inside
    # .data, so a stale .data + fresh .js silently produces garbage reads
    # (wrong shader bytes, wrong splat positions) with no visible error.
    # ETag-only revalidation trades one tiny 304 round-trip per load for
    # eliminating this entire class of bug.
    location ^~ /renderer/data/ {
        alias /var/www/renderer_data/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Reverse-proxy renderer code (html, js, wasm) from Supabase Storage.
    # Only match requests with an actual filename so that bare /renderer/
    # (a React SPA route) falls through to the web proxy.
    location ~ ^/renderer/.+\..+$ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        # Override Content-Type for .html (Supabase returns text/plain).
        proxy_hide_header Content-Type;
        add_header Content-Type $renderer_content_type always;
        # We deploy the renderer frequently enough that a time-based TTL
        # either wastes a revalidation round-trip (no-cache) or leaves users
        # stuck on a stale bundle for up to an hour (max-age=3600). Use
        # no-cache + ETag: the browser revalidates every load but gets a
        # 304-with-no-body when content is unchanged, which is ~a few KB
        # of round-trip overhead and never causes the "old wasm on new data"
        # class of bug.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Drop Supabase's Cloudflare bot-management cookie — it has no effect
        # on anonymous storage access and makes some caches treat the
        # response as uncacheable due to Set-Cookie.
        proxy_hide_header Set-Cookie;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
