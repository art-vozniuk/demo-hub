# Supabase serves .html as text/plain — map correct Content-Types for renderer proxy
map $request_uri $renderer_content_type {
    ~*\.html$   "text/html";
    ~*\.js$     "application/javascript";
    ~*\.wasm$   "application/wasm";
    default     "application/octet-stream";
}

server {
    listen 80;
    server_name artemv.tech www.artemv.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name artemv.tech www.artemv.tech;

    ssl_certificate /etc/letsencrypt/live/artemv.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemv.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Renderer data bundles (~250MB) — served as static files from the VPS.
    # Downloaded from GitHub Releases during deploy to avoid proxy/CORS issues.
    location ^~ /renderer/data/ {
        alias /var/www/renderer_data/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Reverse-proxy renderer code (html, js, wasm) from Supabase Storage.
    # Only match requests with an actual filename so that bare /renderer/
    # (a React SPA route) falls through to the web proxy.
    location ~ ^/renderer/.+\..+$ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        # Override Content-Type for .html (Supabase returns text/plain)
        proxy_hide_header Content-Type;
        add_header Content-Type $renderer_content_type always;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
