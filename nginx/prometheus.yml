global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: demo-hub

# Modal's OTel integration pushes modal.* workspace metrics into the native
# OTLP receiver (nginx /otel/ → /api/v1/otlp/; needs --web.enable-otlp-receiver).
otlp:
  # Promoted to real labels — the Modal System dashboard slices on them.
  promote_resource_attributes:
    - app_name
    - function_name
    - environment_name
    - workspace_name
    - gpu_type

storage:
  tsdb:
    # Pushed OTLP samples can arrive out of order vs the scrape timeline.
    out_of_order_time_window: 30m

# Modal containers are never scraped — their timings come back inside
# generate() responses and dispatch records them.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8081"]

  - job_name: dispatch
    metrics_path: /metrics
    static_configs:
      - targets: ["dispatch:9100"]

  - job_name: compute
    metrics_path: /metrics
    static_configs:
      - targets: ["compute:9100"]

  # Host (VDS) metrics — CPU/mem/disk/net/load via node_exporter.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
