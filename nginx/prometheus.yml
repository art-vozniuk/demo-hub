global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: demo-hub

# Modal's OpenTelemetry integration pushes workspace metrics
# (modal.container.running, modal.gpu.*, modal.input_events.* — tagged
# app_name/function_name/environment_name) straight into Prometheus's
# native OTLP receiver. nginx fronts it at /otel/ with basic auth and
# proxies to /api/v1/otlp/. Requires --web.enable-otlp-receiver on the
# prometheus command line (docker-compose.yml).
otlp:
  # Keep these resource attributes as real labels — they're how the
  # Modal System dashboard slices by app and environment.
  promote_resource_attributes:
    - app_name
    - function_name
    - environment_name
    - workspace_name
    - gpu_type

storage:
  tsdb:
    # Pushed OTLP samples can arrive late relative to the scrape
    # timeline; allow a window of out-of-order appends.
    out_of_order_time_window: 30m

# Self-scrape plus our three long-lived services. Modal containers are
# never scraped: their per-request timings come back inside generate()
# responses and dispatch records them (services/common/observability).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8081"]

  - job_name: dispatch
    metrics_path: /metrics
    static_configs:
      - targets: ["dispatch:9100"]

  - job_name: compute
    metrics_path: /metrics
    static_configs:
      - targets: ["compute:9100"]
