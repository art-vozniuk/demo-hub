# Supabase serves .html as text/plain AND ships a CSP `default-src 'none'; sandbox`.
# Either alone breaks the renderer iframe (text rendered as text; scripts blocked).
# Same map as prod (nginx/nginx.conf) — keep them in sync.
map $uri $renderer_content_type {
    ~*\.html$   "text/html";
    ~*\.js$     "application/javascript";
    ~*\.wasm$   "application/wasm";
    default     "application/octet-stream";
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Renderer assets: serve from the locally-mounted build if present,
    # otherwise fall through to the named-location proxies below. The
    # `^~ /renderer/data/` prefix has to win over `/renderer/` so .data
    # gets its own CORS + cache headers and VPS-backed fallback.

    location ^~ /renderer/data/ {
        alias /usr/share/renderer-build/;
        types {
            application/octet-stream data;
        }
        default_type application/octet-stream;
        try_files $uri @renderer_data_proxy;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location @renderer_data_proxy {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://artemv.tech;
        proxy_ssl_server_name on;
        proxy_set_header Host artemv.tech;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /renderer/ {
        alias /usr/share/renderer-build/;
        types {
            text/html               html;
            application/javascript  js;
            application/wasm        wasm;
        }
        default_type application/octet-stream;
        try_files $uri @renderer_proxy;
        add_header Cache-Control "no-cache" always;
    }

    location @renderer_proxy {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Type;
        add_header Content-Type $renderer_content_type always;
        proxy_hide_header Set-Cookie;
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same as prod nginx.conf: the pipeline trace roots at core, not at
    # the browser tab — strip incoming trace headers on the queue hop.
    location = /api/v1/pipelines/queue {
        proxy_pass http://core:8081/api/v1/pipelines/queue;
        proxy_set_header sentry-trace "";
        proxy_set_header baggage "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
