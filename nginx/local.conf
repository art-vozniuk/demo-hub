# Supabase serves .html as text/plain AND ships a CSP `default-src 'none'; sandbox`.
# Either alone breaks the renderer iframe (text rendered as text; scripts blocked).
# Same map as prod (nginx/nginx.conf) — keep them in sync.
map $uri $renderer_content_type {
    ~*\.html$   "text/html";
    ~*\.js$     "application/javascript";
    ~*\.wasm$   "application/wasm";
    default     "application/octet-stream";
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Renderer assets — local-first, prod-fallback.
    #
    # docker-compose.local.yml bind-mounts services/external/renderer/build-web
    # at /usr/share/renderer-build. When that dir holds a fresh build (run
    # ./scripts/build-renderer.sh), try_files serves Sandbox.{html,js,wasm,data}
    # from disk so wgsl/shader changes are picked up without a Supabase/VPS
    # round-trip. When the dir is empty (first-time setup), the named fallbacks
    # below proxy to prod just like before.
    #
    # Order matters: `^~ /renderer/data/` is the longer prefix and is matched
    # first, so .data requests hit the data-specific location with its CORS +
    # cache headers, not the generic /renderer/ one.

    location ^~ /renderer/data/ {
        alias /usr/share/renderer-build/;
        types {
            application/octet-stream data;
        }
        default_type application/octet-stream;
        try_files $uri @renderer_data_proxy;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Prod fallback: .data lives on the VPS at /var/www/renderer_data/.
    # Same proxy as the previous unconditional block — kept around so a
    # plain `docker compose up` without a prior renderer build still works.
    location @renderer_data_proxy {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://artemv.tech;
        proxy_ssl_server_name on;
        proxy_set_header Host artemv.tech;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /renderer/ {
        alias /usr/share/renderer-build/;
        types {
            text/html               html;
            application/javascript  js;
            application/wasm        wasm;
        }
        default_type application/octet-stream;
        try_files $uri @renderer_proxy;
        add_header Cache-Control "no-cache" always;
    }

    # Prod fallback: Supabase Storage holds Sandbox.html/.js/.wasm. Hides
    # the upstream sandbox CSP + X-Frame-Options and rewrites the text/plain
    # Content-Type Supabase returns for all three extensions.
    location @renderer_proxy {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Type;
        add_header Content-Type $renderer_content_type always;
        proxy_hide_header Set-Cookie;
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
