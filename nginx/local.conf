# Supabase serves .html as text/plain AND ships a CSP `default-src 'none'; sandbox`.
# Either alone breaks the renderer iframe (text rendered as text; scripts blocked).
# Same map as prod (nginx/nginx.conf) — keep them in sync.
map $uri $renderer_content_type {
    ~*\.html$   "text/html";
    ~*\.js$     "application/javascript";
    ~*\.wasm$   "application/wasm";
    default     "application/octet-stream";
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Renderer .data bundles (~100MB) are NOT in Supabase Storage — prod serves
    # them from /var/www/renderer_data/ on the VPS (see nginx/nginx.conf and
    # the renderer-data volume mount in docker-compose.yml). Local dev doesn't
    # have those files, so proxy through production. Without this block the
    # request falls through to the /renderer/ Supabase proxy below and 404s,
    # which makes Emscripten hang on the .data fetch with no abort event —
    # symptom is "renderer stuck loading forever".
    location ^~ /renderer/data/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://artemv.tech;
        proxy_ssl_server_name on;
        proxy_set_header Host artemv.tech;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /renderer/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        # Supabase ships a sandbox CSP + X-Frame-Options that kill the iframe.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        # Override Content-Type for .html / .js / .wasm — Supabase returns
        # text/plain for all of them, which makes the iframe show source code
        # as text instead of executing it.
        proxy_hide_header Content-Type;
        add_header Content-Type $renderer_content_type always;
        # Drop Supabase's Cloudflare bot-management Set-Cookie — irrelevant
        # for anonymous storage and trips some caches into uncacheable mode.
        proxy_hide_header Set-Cookie;
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
