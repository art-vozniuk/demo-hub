server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 50M;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /renderer/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        set $renderer_backend "https://glabfxjyvsflllgldiwq.supabase.co";
        rewrite ^/renderer/(.*) /storage/v1/object/public/media/renderer/$1 break;
        proxy_pass $renderer_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host glabfxjyvsflllgldiwq.supabase.co;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /api/ {
        proxy_pass http://core:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}