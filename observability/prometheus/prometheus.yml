global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: prod

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host (node-exporter) — CPU, memory, disk, network
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Per-container — cadvisor sees all containers on the host
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # RabbitMQ built-in prometheus plugin (3.13 has it bundled)
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # redis-exporter sidecar
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # Core FastAPI — metrics on its existing :8081 via prometheus-fastapi-instrumentator
  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8081']

  # Compute worker — separate prometheus_client.start_http_server on :9091
  - job_name: compute
    static_configs:
      - targets: ['compute:9091']
