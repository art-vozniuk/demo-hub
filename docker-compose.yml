services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ghcr.io/art-vozniuk/core:latest
    container_name: core
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  compute:
    image: ghcr.io/art-vozniuk/compute-cpu:latest
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      RABBITMQ_PREFETCH: "10"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  dispatch:
    image: ghcr.io/art-vozniuk/dispatch:latest
    container_name: dispatch
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      # Bumped from 20: dispatch is pure async I/O (no model in
      # process). At prefetch=20 the worker's max_concurrent_tasks
      # slots above 20 sit idle — RabbitMQ never delivers enough to
      # use them.
      RABBITMQ_PREFETCH: "256"
      WORKER_MAX_CONCURRENT_TASKS: "256"
      DISPATCH_METRICS_PORT: "9100"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: pushgateway
    command:
      - "--web.listen-address=:9091"
      - "--persistence.file=/data/pushgateway"
      - "--persistence.interval=1m"
    volumes:
      - pushgateway_data:/data
    networks:
      - app_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./nginx/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - pushgateway
    networks:
      - app_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./nginx/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./nginx/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network
    restart: unless-stopped

  web:
    image: ghcr.io/art-vozniuk/web:latest
    container_name: web
    ports:
      - "5173:80"
    depends_on:
      - core
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    image: jonasal/nginx-certbot:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    env_file:
      - nginx/.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/user_conf.d/default.conf:ro
      - ./nginx/local.conf:/etc/nginx/user_conf.d/local.conf:ro
      - nginx_secrets:/etc/letsencrypt
      - nginx_webroot:/var/www/letsencrypt
      - ./renderer-data:/var/www/renderer_data:ro
    depends_on:
      - web
      - core
    networks:
      - app_network

volumes:
  rabbitmq_data:
    name: rabbitmq-data
  nginx_secrets:
    name: nginx-secrets
  nginx_webroot:
    name: nginx-webroot
  pushgateway_data:
    name: pushgateway-data
  prometheus_data:
    name: prometheus-data
  grafana_data:
    name: grafana-data

networks:
  app_network:
    driver: bridge
