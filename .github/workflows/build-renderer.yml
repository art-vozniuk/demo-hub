name: build and deploy renderer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write              # needed for gh release upload

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: media
      GH_REPO: ${{ github.repository }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: check if renderer needs rebuild
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build signature = submodule commit + sha256 of this workflow file.
          # Hashing the workflow itself forces a rebuild when the build
          # pipeline changes (upload targets, build flags, dependencies)
          # even when the renderer source is unchanged.
          SUBMODULE=$(git rev-parse HEAD:services/external/OpenGL-Renderer)
          WORKFLOW_SHA=$(sha256sum .github/workflows/build-renderer.yml | cut -d' ' -f1)
          SIGNATURE="submodule=${SUBMODULE};workflow=${WORKFLOW_SHA}"

          echo "current_commit=$SUBMODULE" >> $GITHUB_OUTPUT
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

          # Deployed signature is stored in the release body of 'renderer-latest'.
          DEPLOYED=$(gh release view renderer-latest --json body -q '.body' 2>/dev/null || echo "")

          if [ "$SIGNATURE" = "$DEPLOYED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Renderer up to date at ${SIGNATURE}, skipping build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Renderer signature changed:"
            echo "  old: '${DEPLOYED}'"
            echo "  new: '${SIGNATURE}'"
          fi

      # emsdk is large — cache it between runs to avoid re-downloading LLVM each time.
      # Pin the version string when you need reproducible builds.
      - name: setup emsdk
        if: steps.check.outputs.skip != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: configure (emcmake)
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: build
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer
        run: cmake --build build-web --parallel $(nproc)


      # Sandbox.data (~250MB) exceeds Supabase S3 upload limit — upload to GitHub Releases.
      # The release 'renderer-latest' is recreated each time so the URL stays stable.
      # nginx proxies /renderer/data/* → GitHub Releases for the browser.
      - name: upload Sandbox.data to GitHub Releases
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer/build-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIGNATURE="${{ steps.check.outputs.signature }}"

          # Delete old release if exists, then recreate with current build
          # signature (submodule sha + workflow hash) stored in the body.
          gh release delete renderer-latest --yes 2>/dev/null || true
          gh release create renderer-latest \
            --title "Renderer Build" \
            --notes "$SIGNATURE" \
            Sandbox.data

      # Small files (.html, .js, .wasm) go to S3 (Supabase Storage).
      - name: upload small files to S3
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer/build-web
        run: |
          BASE="s3://${S3_BUCKET}/renderer"
          EP="--endpoint-url ${S3_ENDPOINT}"

          aws s3 cp Sandbox.html "${BASE}/Sandbox.html" ${EP} \
            --content-type "text/html"

          aws s3 cp Sandbox.js "${BASE}/Sandbox.js" ${EP} \
            --content-type "application/javascript"

          aws s3 cp Sandbox.wasm "${BASE}/Sandbox.wasm" ${EP} \
            --content-type "application/wasm"
