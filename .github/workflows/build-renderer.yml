name: build and deploy renderer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write              # needed for gh release upload

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: media
      GH_REPO: ${{ github.repository }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: check if renderer needs rebuild
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(git rev-parse HEAD:services/external/OpenGL-Renderer)
          echo "current_commit=$CURRENT" >> $GITHUB_OUTPUT

          # The deployed version is stored in the release body of 'renderer-latest'.
          DEPLOYED=$(gh release view renderer-latest --json body -q '.body' 2>/dev/null || echo "")

          if [ "$CURRENT" = "$DEPLOYED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Renderer up to date at commit ${CURRENT}, skipping build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Renderer changed: '${DEPLOYED}' -> '${CURRENT}', rebuilding."
          fi

      # emsdk is large — cache it between runs to avoid re-downloading LLVM each time.
      # Pin the version string when you need reproducible builds.
      - name: setup emsdk
        if: steps.check.outputs.skip != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: configure (emcmake)
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: build
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer
        run: cmake --build build-web --parallel $(nproc)

      # Patch the generated Sandbox.html:
      # 1. Hide Emscripten UI, make canvas fill the iframe viewport
      # 2. Add postMessage hook so React knows when renderer is ready
      - name: patch Sandbox.html
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer/build-web
        run: |
          python3 - <<'PYEOF'
          with open('Sandbox.html') as f:
              html = f.read()

          style_patch = """<style>
          #emscripten_logo, .spinner, #status, #progress, #controls, #output {{ display: none !important; }}
          .emscripten_border {{ border: none !important; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }}
          canvas.emscripten {{ max-width: 100vw !important; max-height: 100vh !important; width: auto !important; height: auto !important; display: block; object-fit: contain; }}
          body {{ margin: 0; overflow: hidden; background: #000; }}
          </style>"""

          assert '</head>' in html, "Could not find </head> in Sandbox.html"
          html = html.replace('</head>', style_patch + '\n</head>', 1)

          patch = f"""<script>
          (function () {{
            // Route .data files to /renderer/data/ (proxied to GitHub Releases)
            function hookLocateFile() {{
              if (typeof Module !== 'undefined') {{
                var origLocate = Module.locateFile || function(p) {{ return p; }};
                Module.locateFile = function(path, prefix) {{
                  if (path.endsWith('.data')) {{
                    return '/renderer/data/' + path;
                  }}
                  return origLocate(path, prefix);
                }};
              }} else {{
                requestAnimationFrame(hookLocateFile);
              }}
            }}
            hookLocateFile();

            function hookSetStatus() {{
              if (typeof Module !== 'undefined' && typeof Module.setStatus === 'function') {{
                var orig = Module.setStatus;
                Module.setStatus = function (text) {{
                  orig.call(Module, text);
                  if (window.parent === window) return;
                  if (text === '') {{
                    window.parent.postMessage({{ type: 'renderer-ready' }}, '*');
                    Module.setStatus = orig;
                  }} else {{
                    var m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
                    if (m) {{
                      window.parent.postMessage({{
                        type: 'renderer-progress',
                        loaded: parseFloat(m[1]),
                        total: parseFloat(m[2])
                      }}, '*');
                    }}
                  }}
                }};
              }} else {{
                requestAnimationFrame(hookSetStatus);
              }}
            }}
            hookSetStatus();
          }})();
          </script>"""

          assert '</body>' in html, "Could not find </body> in Sandbox.html"
          html = html.replace('</body>', patch + '\n</body>', 1)

          with open('Sandbox.html', 'w') as f:
              f.write(html)

          print('Patched Sandbox.html with style overrides and postMessage hook.')
          PYEOF

      # Upload all build artifacts to S3 (Supabase Storage).
      # nginx proxies /renderer/* from S3, so all files are served from the same origin.
      - name: upload build artifacts to S3
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer/build-web
        run: |
          BASE="s3://${S3_BUCKET}/renderer"
          EP="--endpoint-url ${S3_ENDPOINT}"

          aws s3 cp Sandbox.html "${BASE}/Sandbox.html" ${EP} \
            --content-type "text/html"

          aws s3 cp Sandbox.js "${BASE}/Sandbox.js" ${EP} \
            --content-type "application/javascript"

          aws s3 cp Sandbox.wasm "${BASE}/Sandbox.wasm" ${EP} \
            --content-type "application/wasm"

          aws s3 cp Sandbox.data "${BASE}/data/Sandbox.data" ${EP} \
            --content-type "application/octet-stream"

      # Also upload to GitHub Releases as backup / stable URL.
      - name: upload Sandbox.data to GitHub Releases
        if: steps.check.outputs.skip != 'true'
        working-directory: services/external/OpenGL-Renderer/build-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT="${{ steps.check.outputs.current_commit }}"

          # Delete old release if exists, then recreate with current commit in body.
          gh release delete renderer-latest --yes 2>/dev/null || true
          gh release create renderer-latest \
            --title "Renderer Build" \
            --notes "$COMMIT" \
            Sandbox.data
