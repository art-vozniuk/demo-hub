name: deploy core infra

on:
  workflow_dispatch:

permissions:
  contents: write              # needed by build-renderer for gh release upload
  packages: write              # needed by build jobs for GHCR push

concurrency:
  group: demo-hub-deploy
  cancel-in-progress: true

jobs:
  # Compare HEAD against the 'last-deploy' tag to detect which services changed.
  # On first deploy (no tag) everything is built.
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      web: ${{ steps.diff.outputs.web }}
      compute: ${{ steps.diff.outputs.compute }}
      dispatch: ${{ steps.diff.outputs.dispatch }}
      modal_flux: ${{ steps.diff.outputs.modal_flux }}
      modal_flux_opt: ${{ steps.diff.outputs.modal_flux_opt }}
      modal_sharp: ${{ steps.diff.outputs.modal_sharp }}
      modal_trellis: ${{ steps.diff.outputs.modal_trellis }}
      modal_flux_t2i: ${{ steps.diff.outputs.modal_flux_t2i }}
      modal_gateway: ${{ steps.diff.outputs.modal_gateway }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect changed paths
        id: diff
        run: |
          if ! BASE=$(git rev-parse last-deploy 2>/dev/null); then
            echo "No 'last-deploy' tag found — building everything."
            echo "core=true"     >> $GITHUB_OUTPUT
            echo "web=true"      >> $GITHUB_OUTPUT
            echo "compute=true"  >> $GITHUB_OUTPUT
            echo "dispatch=true" >> $GITHUB_OUTPUT
            for a in flux flux_opt sharp trellis flux_t2i gateway; do
              echo "modal_$a=true" >> $GITHUB_OUTPUT
            done
            exit 0
          fi

          echo "Comparing $BASE..HEAD"
          changed=$(git diff --name-only "$BASE" HEAD)

          has_core=false
          has_web=false
          has_compute=false
          has_dispatch=false

          # Detection also fires when the per-service build workflow YAML
          # itself changes — otherwise an env / secret / dockerfile-arg
          # tweak in .github/workflows/build-<svc>.yml ships to main but
          # never triggers a rebuild, and prod silently runs the old image
          # with the old baked-in env (DEMO-HUB-style: trellis URLs added
          # to build-dispatch.yml but build-dispatch was skipped because
          # nothing under services/dispatch/ changed in the same commit).
          echo "$changed" | grep -qE '^services/core/|^services/common/|^\.github/workflows/build-core\.yml$' && has_core=true
          echo "$changed" | grep -qE '^services/web/|^\.github/workflows/build-web\.yml$' && has_web=true
          echo "$changed" | grep -qE '^services/compute/|^services/common/|^services/external/face_swap|^\.github/workflows/build-compute(-cpu)?\.yml$' && has_compute=true
          echo "$changed" | grep -qE '^services/dispatch/|^services/common/|^\.github/workflows/build-dispatch\.yml$' && has_dispatch=true

          echo "core=$has_core"         >> $GITHUB_OUTPUT
          echo "web=$has_web"           >> $GITHUB_OUTPUT
          echo "compute=$has_compute"   >> $GITHUB_OUTPUT
          echo "dispatch=$has_dispatch" >> $GITHUB_OUTPUT

          # Modal apps: per-app dir, or services/modal/common/ (ships into all).
          mc=false
          echo "$changed" | grep -qE '^services/modal/common/' && mc=true
          for a in flux flux_opt sharp trellis flux_t2i gateway; do
            v=$mc
            echo "$changed" | grep -qE "^services/modal/$a/" && v=true
            echo "modal_$a=$v" >> $GITHUB_OUTPUT
          done

          echo "Changed files:"
          echo "$changed"
          echo "---"
          echo "core=$has_core web=$has_web compute=$has_compute dispatch=$has_dispatch"

  build-core:
    needs: [check-changes]
    if: needs.check-changes.outputs.core == 'true'
    uses: ./.github/workflows/build-core.yml
    secrets: inherit

  build-web:
    needs: [check-changes]
    if: needs.check-changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  build-compute-cpu:
    needs: [check-changes]
    if: needs.check-changes.outputs.compute == 'true'
    uses: ./.github/workflows/build-compute-cpu.yml
    secrets: inherit

  build-dispatch:
    needs: [check-changes]
    if: needs.check-changes.outputs.dispatch == 'true'
    uses: ./.github/workflows/build-dispatch.yml
    secrets: inherit

  # Runs in parallel with other builds. Skips the Emscripten compile when the
  # renderer submodule commit hasn't changed since the last deploy.
  build-renderer:
    uses: ./.github/workflows/build-renderer.yml
    secrets: inherit

  deploy:
    needs: [check-changes, build-core, build-web, build-compute-cpu, build-dispatch, build-renderer]
    # Run deploy even when some builds were skipped (not needed).
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy compose and nginx configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx"
          target: demo-hub

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.1.0
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          CERTBOT_DOMAINS: ${{ secrets.CERTBOT_DOMAINS }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
          # Mirror check-changes outputs into env so the SSH script can
          # skip pulling images for services that didn't change. Saves
          # ~3.67 GB / ~5 minutes per deploy when only core or web moved
          # (compute image is the heavyweight one).
          CHANGED_CORE: ${{ needs.check-changes.outputs.core }}
          CHANGED_WEB: ${{ needs.check-changes.outputs.web }}
          CHANGED_COMPUTE: ${{ needs.check-changes.outputs.compute }}
          CHANGED_DISPATCH: ${{ needs.check-changes.outputs.dispatch }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RABBITMQ_USER,RABBITMQ_PASSWORD,CERTBOT_EMAIL,CERTBOT_DOMAINS,GHCR_TOKEN,GH_ACTOR,GH_REPO,CHANGED_CORE,CHANGED_WEB,CHANGED_COMPUTE,CHANGED_DISPATCH
          script: |
            set -euo pipefail

            cd demo-hub

            # Ensure nginx env exists (used by jonasal/nginx-certbot)
            mkdir -p nginx
            cat > nginx/.env << EOF
            CERTBOT_EMAIL=${CERTBOT_EMAIL}
            CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
            EOF

            # docker-compose.yml bind-mounts nginx/pushgateway.htpasswd into
            # nginx. Ensure it exists as a FILE before `up`, or Docker creates
            # a directory at that path. Empty => /pushgateway/ 403 (metrics
            # blocked, site still up) until the real credential is set:
            #   htpasswd -B nginx/pushgateway.htpasswd modal
            [ -f nginx/pushgateway.htpasswd ] || touch nginx/pushgateway.htpasswd

            # Download renderer data files from GitHub Releases to serve statically.
            # Skips download if the file already matches the current release.
            echo "Downloading renderer data from GitHub Releases..."
            mkdir -p renderer-data
            RELEASE_URL="https://github.com/${GH_REPO}/releases/download/renderer-latest/Sandbox.data"
            curl -fSL -o renderer-data/Sandbox.data.tmp "$RELEASE_URL" \
              && mv renderer-data/Sandbox.data.tmp renderer-data/Sandbox.data \
              || echo "Warning: failed to download Sandbox.data (renderer may not work)"

            # Export variables used by docker-compose.yml
            export RABBITMQ_USER="${RABBITMQ_USER}"
            export RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD}"

            echo "Logging in to GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # Pull only services whose source actually changed since the
            # last deploy. The compute image is ~3.67 GB (PyTorch + ONNX
            # + insightface + reactor-face-swap), so an unconditional
            # `docker compose pull` adds ~5 minutes to every deploy even
            # for a tiny core/web change. check-changes already computed
            # which services moved — re-use those flags here.
            services_to_pull=""
            [ "${CHANGED_CORE:-true}"     = "true" ] && services_to_pull="$services_to_pull core"
            [ "${CHANGED_WEB:-true}"      = "true" ] && services_to_pull="$services_to_pull web"
            [ "${CHANGED_COMPUTE:-true}"  = "true" ] && services_to_pull="$services_to_pull compute"
            [ "${CHANGED_DISPATCH:-true}" = "true" ] && services_to_pull="$services_to_pull dispatch"
            if [ -n "$services_to_pull" ]; then
              echo "Pulling images for changed services:$services_to_pull"
              docker compose pull $services_to_pull
            else
              echo "No service images changed since last deploy — skipping pull."
            fi

            echo "Starting / updating services..."
            docker compose up -d --remove-orphans --scale compute=1

            echo "Recreating nginx to pick up config changes..."
            docker compose up -d --force-recreate nginx

            echo "Testing ACME challenge path (must return 200)..."
            docker compose exec -T nginx sh -lc 'mkdir -p /var/www/letsencrypt/.well-known/acme-challenge && echo ok > /var/www/letsencrypt/.well-known/acme-challenge/test.txt'
            # --retry-connrefused absorbs the gap between `compose up` returning
            # and jonasal/nginx-certbot's init scripts actually binding port 80.
            curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "http://artemv.tech/.well-known/acme-challenge/test.txt" | grep -qx "ok"

            echo "Attempting certbot renew (safe to run every deploy)..."
            docker compose exec -T nginx certbot renew || true

            echo "Show current certificate dates (for debugging)..."
            echo | openssl s_client -servername artemv.tech -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -dates || true

            echo "Deployment completed successfully!"

  # Deploy changed Modal apps to the `main` environment. Endpoint-less model
  # apps first, gateway LAST — each migrated app drops its 2 web endpoints, so
  # the 8-web-function free-tier cap is never exceeded mid-deploy.
  deploy-modal:
    needs: [check-changes]
    if: |
      needs.check-changes.outputs.modal_flux == 'true' ||
      needs.check-changes.outputs.modal_flux_opt == 'true' ||
      needs.check-changes.outputs.modal_sharp == 'true' ||
      needs.check-changes.outputs.modal_trellis == 'true' ||
      needs.check-changes.outputs.modal_flux_t2i == 'true' ||
      needs.check-changes.outputs.modal_gateway == 'true'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'modal>=1.4.2'
      - name: deploy flux
        if: needs.check-changes.outputs.modal_flux == 'true'
        run: python services/modal/flux/deploy.py
      - name: deploy flux_opt
        if: needs.check-changes.outputs.modal_flux_opt == 'true'
        run: python services/modal/flux_opt/deploy.py
      - name: deploy sharp
        if: needs.check-changes.outputs.modal_sharp == 'true'
        run: python services/modal/sharp/deploy.py
      - name: deploy trellis
        if: needs.check-changes.outputs.modal_trellis == 'true'
        run: python services/modal/trellis/deploy.py
      - name: deploy flux_t2i
        if: needs.check-changes.outputs.modal_flux_t2i == 'true'
        run: python services/modal/flux_t2i/deploy.py
      - name: deploy gateway
        if: needs.check-changes.outputs.modal_gateway == 'true'
        run: python services/modal/gateway/deploy.py

  # Advance the marker only after BOTH the VDS deploy and the Modal deploy
  # succeed — else a failed Modal deploy would be skipped on the next run.
  tag:
    needs: [deploy, deploy-modal]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: update last-deploy tag
        run: |
          git tag -f last-deploy HEAD
          git push -f origin last-deploy
