name: deploy modal (main)

# Deploys the per-model Modal apps into the `main` (production) Modal
# environment. Auth is a Modal service token in the MODAL_TOKEN_ID /
# MODAL_TOKEN_SECRET repo secrets (give it Contributor on the `main`
# environment only); MODAL_ENVIRONMENT=main selects the target env.
#
# Each app deploys ONLY when its own files (or services/modal/common/,
# which every app ships) changed since the last successful deploy, so a
# one-line tweak doesn't redeploy every GPU app and pay N cold starts.
# The marker is the `last-modal-deploy` git tag (mirrors deploy-core-infra's
# `last-deploy`). Seed it once to skip a first-run deploy-all:
#   git tag last-modal-deploy <current-main> && git push origin last-modal-deploy
#
# The web gateway (services/modal/gateway) is intentionally NOT deployed
# here — `main` already spends all 8 of the workspace's free-tier web
# functions on flux/sharp/trellis/flux_t2i (submit+poll each). See the
# commented-out `deploy gateway` step and docs/DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app(s) to deploy"
        type: choice
        default: changed
        options:
          - changed
          - all
          - flux
          - sharp
          - trellis
          - flux_t2i
          - flux_opt
  push:
    branches: [main]
    paths:
      - 'services/modal/**'
      - '.github/workflows/deploy-modal.yml'

# Don't cancel an in-flight deploy — a half-applied `modal deploy` is worse
# than a queued one. Serialize instead.
concurrency:
  group: demo-hub-modal-deploy
  cancel-in-progress: false

permissions:
  contents: write   # push the last-modal-deploy tag

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      flux: ${{ steps.decide.outputs.flux }}
      sharp: ${{ steps.decide.outputs.sharp }}
      trellis: ${{ steps.decide.outputs.trellis }}
      flux_t2i: ${{ steps.decide.outputs.flux_t2i }}
      flux_opt: ${{ steps.decide.outputs.flux_opt }}
      comprehensive: ${{ steps.decide.outputs.comprehensive }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: decide which apps to deploy
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.app || 'changed' }}
        run: |
          set -euo pipefail
          apps="flux sharp trellis flux_t2i flux_opt"

          # workflow_dispatch with a specific app -> just that one; leave the
          # marker put so a later 'changed' run still sees the other pending apps.
          if [ "$FORCE" != "changed" ] && [ "$FORCE" != "all" ]; then
            for a in $apps; do
              [ "$a" = "$FORCE" ] && echo "$a=true" >> "$GITHUB_OUTPUT" || echo "$a=false" >> "$GITHUB_OUTPUT"
            done
            echo "comprehensive=false" >> "$GITHUB_OUTPUT"
            echo "Forced single app: $FORCE"
            exit 0
          fi

          # workflow_dispatch 'all' -> everything.
          if [ "$FORCE" = "all" ]; then
            for a in $apps; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            echo "comprehensive=true" >> "$GITHUB_OUTPUT"
            echo "Forced all apps"
            exit 0
          fi

          # push, or dispatch 'changed' -> diff against the marker tag.
          # First run (no tag) deploys everything.
          if ! BASE=$(git rev-parse last-modal-deploy 2>/dev/null); then
            echo "No last-modal-deploy tag — deploying all apps."
            for a in $apps; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            echo "comprehensive=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $BASE..HEAD"
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"

          # services/modal/common/ ships into every app; a change to this
          # workflow can alter env/auth for all of them. Either -> redeploy all.
          common=false
          echo "$changed" | grep -qE '^services/modal/common/' && common=true
          echo "$changed" | grep -qE '^\.github/workflows/deploy-modal\.yml$' && common=true

          for a in $apps; do
            has=false
            echo "$changed" | grep -qE "^services/modal/$a/" && has=true
            $common && has=true
            echo "$a=$has" >> "$GITHUB_OUTPUT"
          done
          echo "comprehensive=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [check-changes]
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install modal
        run: pip install 'modal>=1.4.2'

      # deploy.py chdirs into services/modal/ and shells out to
      # `modal deploy <app>/app.py`; modal reads MODAL_ENVIRONMENT + the
      # token pair from the job env above.
      - name: deploy flux
        if: needs.check-changes.outputs.flux == 'true'
        run: python services/modal/flux/deploy.py

      - name: deploy sharp
        if: needs.check-changes.outputs.sharp == 'true'
        run: python services/modal/sharp/deploy.py

      - name: deploy trellis
        if: needs.check-changes.outputs.trellis == 'true'
        run: python services/modal/trellis/deploy.py

      - name: deploy flux_t2i
        if: needs.check-changes.outputs.flux_t2i == 'true'
        run: python services/modal/flux_t2i/deploy.py

      # flux_opt exposes 0 web endpoints (it's routed through the gateway by
      # name), so it's safe under the 8-web-function cap. Experimental; the
      # live frontend never calls it.
      - name: deploy flux_opt
        if: needs.check-changes.outputs.flux_opt == 'true'
        run: python services/modal/flux_opt/deploy.py

      # --- GATEWAY: intentionally NOT deployed to `main` ----------------------
      # `main` already spends all 8 free-tier web functions on
      # flux/sharp/trellis/flux_t2i (submit+poll = 8). The gateway adds 2
      # more, so `modal deploy gateway/app.py` would exceed the cap and fail.
      # Enable this ONLY after the live models are migrated behind the gateway
      # (drop their own web endpoints), which collapses prod to 2 web
      # functions total. In dev the gateway runs via `modal serve` instead —
      # ephemeral endpoints don't count against the cap. See docs/DEPLOY.md.
      #
      # - name: deploy gateway
      #   run: python services/modal/gateway/deploy.py

  tag:
    needs: [check-changes, deploy]
    # Advance the marker only after a comprehensive deploy (push, or dispatch
    # changed/all). A forced single-app deploy leaves it put.
    if: ${{ success() && needs.check-changes.outputs.comprehensive == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: update last-modal-deploy tag
        run: |
          git tag -f last-modal-deploy HEAD
          git push -f origin last-modal-deploy
