# Repo-wide ruff configuration.
#
# `lint.select` pins the rule set this codebase actually enforces — ruff's
# historical default (pycodestyle errors + pyflakes). It is explicit rather than
# implicit because ruff 0.16 widened its defaults to include flake8-bugbear and
# isort, which this codebase has never satisfied: without this file, upgrading
# ruff turns CI red on 200+ pre-existing findings (mostly `B008` on FastAPI's
# `Depends(...)` defaults, which is idiomatic here) that have nothing to do with
# whatever change is under review. Adopting those rules is worth doing — as its
# own sweep, not as a side effect of a version bump.
lint.select = ["E4", "E7", "E9", "F"]

# Vendored submodules (renderer, face_swap) aren't ours to lint. Mirrors the
# --exclude the Makefile and CI pass, so a bare `ruff check` behaves the same.
extend-exclude = ["services/external"]
